name: Examples
on:
  # Skip docs-only changes, except docs/round-trips.md, which the conformance
  # jobs check (a later pattern overrides an earlier one). Root-level Markdown
  # only: the manifest goldens under cmd/sqlgen/testdata are .md files the
  # example runs check.
  pull_request:
    paths: &code
      - '**'
      - '!*.md'
      - '!docs/**'
      - '!guidelines/**'
      - '!.claude/**'
      - '!.gitignore'
      - '!LICENSE'
      - 'docs/round-trips.md'
  push:
    branches: [main]
    paths: *code

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: discover examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
      dialects: ${{ steps.dialects.outputs.dialects }}
    steps:
      - uses: actions/checkout@v7
      # Every directory with a go.mod is an example module, the same set the
      # Makefile's EXAMPLE_DIRS globs, so a new example is picked up without
      # editing this file.
      - id: list
        run: |
          examples=$(find cmd/sqlgen/testdata/examples -mindepth 2 -maxdepth 2 -name go.mod \
            | xargs -n1 dirname | xargs -n1 basename | sort | jq -R . | jq -sc .)
          echo "examples=$examples" >> "$GITHUB_OUTPUT"
      # The conformance dialect modules: every module beside the two suites
      # and the round-trip module, the same set as the Makefile's
      # CONFORMANCE_DIALECT_DIRS.
      - id: dialects
        run: |
          dialects=$(find cmd/sqlgen/testdata/conformance -mindepth 2 -maxdepth 2 -name go.mod \
            | xargs -n1 dirname | xargs -n1 basename | grep -vxE 'suite|features_suite|roundtrip' | sort | jq -R . | jq -sc .)
          echo "dialects=$dialects" >> "$GITHUB_OUTPUT"

  lint:
    name: lint (${{ matrix.example }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned golangci-lint version
        id: tools
        run: echo "version=v$(sed -n 's/^golangci-lint[[:space:]]\{1,\}//p' .tool-versions | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: cmd/sqlgen/testdata/examples/${{ matrix.example }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: ${{ steps.tools.outputs.version }}
          args: --timeout=5m
          working-directory: cmd/sqlgen/testdata/examples/${{ matrix.example }}

  test:
    name: test (${{ matrix.example }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: cmd/sqlgen/testdata/examples/${{ matrix.example }}/go.sum
      - run: go test -race -count=1 -timeout=10m ./...
        env:
          GOWORK: off
        working-directory: cmd/sqlgen/testdata/examples/${{ matrix.example }}

  # The cross-dialect conformance suite (docs/design/CONFORMANCE.md §4). It
  # checks that each dialect's committed models/ is fresh, then runs the suite,
  # whose TestConformance/RoundTrips subtest fails when the measured round
  # trips differ from docs/round-trips.md (`make round-trips` regenerates it).
  # docs/conformance/REPORT.md is not regenerated here: /close-phase and
  # deliberate `make conformance` runs rewrite it.
  conformance:
    name: conformance (${{ matrix.dialect }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: ${{ fromJSON(needs.discover.outputs.dialects) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            cmd/sqlgen/testdata/conformance/${{ matrix.dialect }}/go.sum
            cmd/sqlgen/go.sum
      # sqlgen diff exits 1 when generate would change a file (PRD §23.6).
      - name: models/ is fresh
        run: go run github.com/teandresmith/sqlgen/cmd/sqlgen diff --quiet
        working-directory: cmd/sqlgen/testdata/conformance/${{ matrix.dialect }}
      - run: go test -race -count=1 -timeout=10m ./...
        env:
          GOWORK: off
        working-directory: cmd/sqlgen/testdata/conformance/${{ matrix.dialect }}

  # The round-trip measurement module's own tests: wave counting, and the
  # report's rendering and parsing.
  roundtrip:
    name: conformance (roundtrip tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: cmd/sqlgen/testdata/conformance/roundtrip/go.sum
      - run: go test -race -count=1 ./...
        env:
          GOWORK: off
        working-directory: cmd/sqlgen/testdata/conformance/roundtrip
