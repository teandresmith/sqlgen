name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No release-type input: it would override release-please-config.json
      # and .release-please-manifest.json, which this action reads by default.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Release Please tags the root module. Go installs each submodule from its own
  # path-prefixed tag (cmd/sqlgen/vX.Y.Z), so tag those too; see the script.
  tag-modules:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false
      - run: .github/scripts/tag-modules.sh "$TAG"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

  # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so call
  # the release workflow directly.
  release:
    needs: [release-please, tag-modules]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
