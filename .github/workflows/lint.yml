name: Lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors MODULES in the Makefile and the use list in go.work.
        module:
          - "."
          - "parser"
          - "cmd/sqlgen"
          - "event/natsbus"
          - "cache/memory"
          - "cache/redis"
          - "cache/msgpack"
          - "metrics/otel"
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned golangci-lint version
        id: tools
        run: echo "version=v$(sed -n 's/^golangci-lint[[:space:]]\{1,\}//p' .tool-versions | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            go.work.sum
      # golangci-lint also runs the gofumpt and goimports formatters.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.tools.outputs.version }}
          args: --timeout=5m
          working-directory: ${{ matrix.module }}

  repo-checks:
    name: repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No internal references or build tags
        run: make refs-check
      - name: Tracker structure
        run: make tracker-check
