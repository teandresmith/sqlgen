name: Test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors MODULES in the Makefile and the use list in go.work.
        module:
          - "."
          - "parser"
          - "cmd/sqlgen"
          - "event/natsbus"
          - "cache/memory"
          - "cache/redis"
          - "cache/msgpack"
          - "metrics/otel"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            go.work.sum
      - run: go test -short -race -count=1 -timeout=30m ./...
        working-directory: ${{ matrix.module }}

  # Runs only once every unit job passes, so a broken build fails in minutes
  # instead of after the container-backed suite.
  integration:
    name: integration (${{ matrix.module }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors MODULES in the Makefile and the use list in go.work.
        module:
          - "."
          - "parser"
          - "cmd/sqlgen"
          - "event/natsbus"
          - "cache/memory"
          - "cache/redis"
          - "cache/msgpack"
          - "metrics/otel"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            go.work.sum
      # Testcontainers needs the runner's Docker daemon, which ubuntu-latest
      # provides.
      - run: go test -race -count=1 -timeout=30m ./...
        working-directory: ${{ matrix.module }}
