version: v1
input:
  dialect: postgres
  paths:
    # The same DDL as the pgx module: this module varies only the driver.
    - ../postgres/schema.sql
output:
  driver: stdlib
  dir: ./models
  package: models
tables:
  products:
    # Small enough that a handful of keys spans several sub-batches.
    batch_size: 2
    # A cursor order that differs from insertion order, so Connection's sort
    # is observable; id breaks price ties.
    cursor_keys: [price, id]
  documents:
    batch_size: 2
  revisions:
    batch_size: 2
overrides:
  types:
    # citext has no built-in Go type.
    citext:
      type: string
